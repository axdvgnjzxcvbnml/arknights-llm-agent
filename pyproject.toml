[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "arknights-llm-agent"
version = "0.1.0"
description = "明日方舟 LLM Agent：视觉感知 + 慢思考决策 + RAG/MCP 知识 + 动作执行"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [{name = "arknights-llm-agent"}]

[project.optional-dependencies]
api = ["fastapi>=0.116", "uvicorn>=0.30", "httpx>=0.27"]

[tool.setuptools]
packages = [
    "action",
    "agent",
    "agent.prompt_templates",
    "api",
    "configs",
    "data",
    "docs",
    "env",
    "knowledge",
    "knowledge.crawler",
    "knowledge.graph",
    "knowledge.mcp_tools",
    "knowledge.rag",
    "perception",
    "scripts",
    "tests",
    "training",
]
